# Memoria do daemon do Gradle. 2 GB sobra para um modulo unico, e o padrao (512 MB) e
# pouco para o processo do R8/dex em builds maiores.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Um app so, sem bibliotecas AndroidX: nada de migracao de namespace nem jetifier.
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
