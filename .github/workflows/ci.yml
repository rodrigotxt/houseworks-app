name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API e contrato
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Lint do contrato (OpenAPI)
        run: npx --yes @redocly/cli@latest lint docs/openapi.yaml

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      # O mongodb-memory-server baixa o mongod na primeira execucao; o cache evita
      # repetir os ~120MB a cada push.
      - name: Cache do mongod
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}

      - name: Testes
        working-directory: backend
        run: npm test

  imagem:
    name: Imagem de producao
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Construir o alvo de producao e o que pega uma imagem que nao sobe.
      - name: Build
        run: docker build --target production -t houseworks-api:ci backend

  # O app da TV e o unico artefato que ninguem compila no dia a dia: sem este job, ele
  # quebraria em silencio e so seria descoberto no dia de instalar na televisao.
  tv:
    name: App da TV (APK)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # O runner do GitHub ja vem com o Android SDK instalado; falta aceitar as licencas
      # para ele baixar a plataforma e as build-tools que o build pedir.
      - name: Aceitar as licencas do SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Compilar o APK de debug
        working-directory: tv
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: houseworks-tv-debug
          path: tv/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
