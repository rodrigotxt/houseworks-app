services:
  mongodb:
    # Versao FIXA de proposito. O "latest" apontava para uma versao que se recusa a
    # subir em kernels 6.19+ ("MongoDB cannot start: Linux kernel versions 6.19 and newer
    # has a known incompatibility"), e o estrago aparecia como "backend nao conecta" —
    # sintoma longe da causa. Infra fixa, nao flutuante.
    image: mongo:8.2
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # O Dockerfile tem dois alvos; o compose usa o de desenvolvimento (nodemon +
      # inspector). Producao e `docker build --target production`.
      target: development
    container_name: backend-app
    ports:
      - "3001:3000"  # Host:Container
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB_NAME}?authSource=admin
      JWT_SECRET: ${JWT_SECRET_KEY}
      PORT: 3000
      # Sem ALLOWED_ORIGINS o navegador nao consegue falar com a API a partir do front.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
    volumes:
      - ./backend:/app
      - /app/node_modules
    # Opcional de proposito: o compose antigo falhava com "env file not found" quando
    # este arquivo nao existia, e nada aqui e obrigatorio — o bloco acima ja cobre o
    # que o backend precisa. Serve para quem quiser variaveis extras locais.
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      - mongodb
    restart: unless-stopped

  # O frontend vive em um REPOSITORIO IRMAO (../houseworks-frontend), nao dentro deste.
  # O workspace do VS Code (HouseWorks.code-workspace) ja espera os dois lado a lado.
  #
  # Consequencia pratica: "docker compose up" precisa dos dois checkouts. Para trabalhar
  # so na API, use "docker compose up -d mongodb backend".
  frontend:
    build:
      context: ../houseworks-frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      # O browser roda FORA da rede do compose: precisa do endereco publicado no host
      # (3001), nao do nome do servico. Sem esta variavel o front sobe sem saber onde
      # esta a API e toda chamada falha.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
    volumes:
      - ../houseworks-frontend:/app
      - /app/node_modules
    env_file:
      - path: ../houseworks-frontend/.env
        required: false
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data: